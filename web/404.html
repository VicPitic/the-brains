<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No brain here · The Brains</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem("brains.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lato:wght@400;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module">
      import { mountChrome } from "/assets/shared.js";
      mountChrome();
    </script>
    <script defer async data-host="brains.ceo" src="https://liteanalytics.com/lite.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="logo" href="/" data-logo>The Brains</a>
        <nav class="nav" aria-label="Main">
          <a class="nav-link optional" href="/">All brains</a>
          <a class="nav-link" href="/roundtables">Roundtables</a>
          <a class="nav-link optional" data-request>Request a brain</a>
          <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark theme"></button>
        </nav>
      </div>
    </header>
    <main class="wrap notfound">
      <h1>No brain here yet.</h1>
      <p>This page doesn't exist, or this person doesn't have a brain on The Brains so far.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">See all brains</a>
        <a class="btn btn-ghost" data-mail="Brain request">Request a brain</a>
      </div>
    </main>
  </body>
</html>
